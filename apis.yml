description: 'Sana Biotechnology is a clinical-stage biotechnology company (NASDAQ:
  SANA) focused on engineering cells as medicines. Its platforms repair or control
  genes inside cells and replace missing or damaged cells to address the underlying
  causes of disease, with drug candidates spanning type 1 diabetes, B-cell cancers,
  and B-cell-mediated autoimmune disorders. Surfaced as a portfolio company of gv
  and added to the API Evangelist network for enrichment. As of this enrichment pass
  Sana publishes no public API, developer portal, or technical documentation; this
  profile captures company identity and domain-security posture only.'
